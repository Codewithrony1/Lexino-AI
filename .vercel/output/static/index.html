<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LEXINO AI - Professional Chat Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animated-wallpaper wallpaper-none" id="animatedWallpaper" aria-hidden="true"></div>
    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>
            <div class="setting-item">
                <label>AI Model</label>
                <select id="modelSelect">
                    <option value="llama-3.3-70b-versatile">Llama 3.3 70B Versatile</option>
                    <option value="llama-3.1-8b-instant" selected>Llama 3.1 8B Instant</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Max Response Length</label>
                <select id="maxTokens">
                    <option value="500">Short (500 tokens)</option>
                    <option value="1000">Medium (1,000 tokens)</option>
                    <option value="2000" selected>Long (2,000 tokens)</option>
                    <option value="4000">Very Long (4,000 tokens)</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Language</label>
                <select id="language">
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="hi">Hindi</option>
                </select>
            </div>
            <div class="setting-item">
                <label>Wallpaper</label>
                <div class="wallpaper-grid" id="wallpaperGrid">
                    <button class="wallpaper-option active" data-wallpaper="none" onclick="setWallpaper('none')">
                        <span class="wallpaper-preview preview-none"></span>
                        <span>Default</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="aurora" onclick="setWallpaper('aurora')">
                        <span class="wallpaper-preview preview-aurora"></span>
                        <span>Deep Aurora</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="neon" onclick="setWallpaper('neon')">
                        <span class="wallpaper-preview preview-neon"></span>
                        <span>Neon Matrix</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="mesh" onclick="setWallpaper('mesh')">
                        <span class="wallpaper-preview preview-mesh"></span>
                        <span>Signal Mesh</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="starfall" onclick="setWallpaper('starfall')">
                        <span class="wallpaper-preview preview-starfall"></span>
                        <span>Quiet Stars</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="particlefield" onclick="setWallpaper('particlefield')">
                        <span class="wallpaper-preview preview-particlefield"></span>
                        <span>Particle Field</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="sunset" onclick="setWallpaper('sunset')">
                        <span class="wallpaper-preview preview-sunset"></span>
                        <span>Solar Dusk</span>
                    </button>
                    <button class="wallpaper-option" data-wallpaper="universe" onclick="setWallpaper('universe')">
                        <span class="wallpaper-preview preview-universe"></span>
                        <span>Smoky Universe</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="settings-modal" id="profileModal">
        <div class="settings-content profile-content">
            <div class="settings-header">
                <h2>Profile</h2>
                <button class="close-btn" onclick="closeProfileModal()">x</button>
            </div>
            <div class="setting-item">
                <label>Full Name</label>
                <input type="text" id="profileNameInput" placeholder="Enter your name">
            </div>
            <div class="setting-item">
                <label>Email</label>
                <input type="email" id="profileEmailInput" placeholder="Enter your email">
            </div>
            <div class="setting-item">
                <label>Bio</label>
                <textarea id="profileBioInput" rows="3" placeholder="Short bio"></textarea>
            </div>
            <div class="profile-modal-actions">
                <button class="profile-btn secondary" onclick="closeProfileModal()">Cancel</button>
                <button class="profile-btn primary" onclick="saveProfile()">Save Profile</button>
            </div>
        </div>
    </div>
    <div class="settings-modal" id="deleteConfirmModal">
        <div class="settings-content delete-confirm-content">
            <div class="settings-header">
                <h2>Delete Chat</h2>
            </div>
            <p class="delete-confirm-text">Delete this chat?</p>
            <p class="delete-confirm-title" id="deleteConfirmTitle"></p>
            <div class="profile-modal-actions">
                <button class="profile-btn secondary" onclick="closeDeleteConfirmModal()">No</button>
                <button class="profile-btn danger" onclick="confirmDeleteFromModal()">Yes, Delete</button>
            </div>
        </div>
    </div>
    <div class="settings-modal" id="shareChatModal">
        <div class="settings-content share-chat-content">
            <div class="settings-header">
                <h2>Share Chat</h2>
                <button class="close-btn" onclick="closeShareChatModal()">&times;</button>
            </div>
            <p class="share-chat-title" id="shareChatTitle"></p>
            <div class="share-link-box">
                <input id="shareChatLink" type="text" readonly aria-label="Share chat link">
                <button class="profile-btn secondary" onclick="copyShareChatLink()">Copy Link</button>
            </div>
            <div class="profile-modal-actions">
                <button class="profile-btn secondary" onclick="copyShareChatText()">Copy Chat</button>
                <button class="profile-btn primary" onclick="nativeShareCurrentChat()">Share</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="collapsed-rail" id="collapsedRail">
                <button class="rail-btn rail-logo" onclick="toggleSidebar()" title="Open Sidebar">
                    <img
                        class="rail-icon-img"
                        src="Images/burger-bar.png"
                        alt="Menu"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
                    >
                    <span class="rail-icon-text" style="display: none;">&#9776;</span>
                </button>
                <button class="rail-btn" onclick="startNewChat()" title="New chat">
                    <img
                        class="rail-icon-img"
                        src="Images/new-chat.png"
                        alt="New chat"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
                    >
                    <span class="rail-icon-text" style="display: none;">&#9998;</span>
                </button>
                <button class="rail-btn" onclick="searchChats()" title="Search chats">
                    <img
                        class="rail-icon-img"
                        src="Images/search.png"
                        alt="Search chats"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
                    >
                    <span class="rail-icon-text" style="display: none;">&#8981;</span>
                </button>
                <div class="rail-spacer"></div>
                <button class="rail-avatar-btn" id="railAvatarBtn" onclick="toggleRailQuickMenu(event)" title="Account menu">
                    <span id="railProfileInitial">RR</span>
                </button>
                <div class="rail-quick-menu" id="railQuickMenu" onclick="event.stopPropagation()" role="menu" aria-label="Quick account menu">
                    <button class="rail-quick-item" onclick="closeRailQuickMenu(); openProfileModal();">
                        <span class="rail-quick-icon">&#9786;</span>
                        <span>Profile</span>
                    </button>
                    <button class="rail-quick-item" onclick="closeRailQuickMenu(); openSettings();">
                        <span class="rail-quick-icon">&#9881;</span>
                        <span>Settings</span>
                    </button>
                    <button class="rail-quick-item" onclick="closeRailQuickMenu(); openHelp();">
                        <span class="rail-quick-icon">?</span>
                        <span>Help</span>
                    </button>
                </div>
            </div>
            <div class="sidebar-topbar">
                <div class="sidebar-brand-wrap">
                    <div class="sidebar-logo-symbol">◎</div>
                    <button class="sidebar-custom-image-btn" onclick="triggerSidebarBrandImage()" title="Change image">
                        <img id="sidebarBrandImage" class="sidebar-brand-image" src="" alt="Brand image">
                        <span id="sidebarBrandPlaceholder">+</span>
                    </button>
                </div>
                <button class="sidebar-collapse-btn" onclick="closeSidebar()" title="Close sidebar">◧</button>
            </div>
            <input type="file" id="sidebarBrandInput" class="file-input" accept="image/*" onchange="handleSidebarBrandUpload(event)">

            <div class="sidebar-section">
                <div class="sidebar-menu-item" onclick="startNewChat()">
                    <span class="icon">✎</span>
                    <span>New chat</span>
                </div>
                <div class="sidebar-menu-item" id="searchChatsMenu" onclick="searchChats()">
                    <span class="icon">⌕</span>
                    <span>Search chats</span>
                </div>
            </div>
            <aside class="search-panel" id="searchPanel">
                <div class="search-panel-header">
                    <h3>Search Chats</h3>
                    <button class="search-panel-close" onclick="closeSearchPanel()" title="Close">x</button>
                </div>
                <div class="search-panel-body">
                    <input
                        class="search-input"
                        id="searchInput"
                        type="text"
                        placeholder="Search saved chats..."
                        oninput="handleSearchInput(this.value)"
                    >
                    <div class="search-results" id="searchResults"></div>
                </div>
            </aside>


            <div class="chat-history" id="chatHistory"></div>
            <div class="sidebar-footer">
                <button class="sidebar-account-card" id="sidebarAccountBtn" onclick="toggleSidebarAccountMenu(event)" title="Account menu">
                    <div class="sidebar-account-avatar" id="sidebarAccountInitial">R</div>
                    <div class="sidebar-account-text">
                        <div class="sidebar-account-name" id="sidebarAccountName">Ritik</div>
                        <div class="sidebar-account-handle" id="sidebarAccountHandle">@ritik</div>
                    </div>
                    <span class="sidebar-account-arrow">&#8250;</span>
                </button>
                <div class="sidebar-account-menu" id="sidebarAccountMenu" onclick="event.stopPropagation()" role="menu" aria-label="Account menu">
                    <button class="sidebar-account-item" onclick="closeSidebarAccountMenu(); upgradePlan();">
                        <span class="icon">&#10024;</span>
                        <span>Upgrade plan</span>
                    </button>
                    <button class="sidebar-account-item" onclick="closeSidebarAccountMenu(); openSettings();">
                        <span class="icon">&#9788;</span>
                        <span>Personalization</span>
                    </button>
                    <button class="sidebar-account-item" onclick="closeSidebarAccountMenu(); openSettings();">
                        <span class="icon">&#9881;</span>
                        <span>Settings</span>
                    </button>
                    <button class="sidebar-account-item" onclick="closeSidebarAccountMenu(); openHelp();">
                        <span class="icon">?</span>
                        <span>Help</span>
                    </button>
                    <button class="sidebar-account-item danger" onclick="closeSidebarAccountMenu(); logoutAccount();">
                        <span class="icon">&#10162;</span>
                        <span>Log out</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Chat -->
        <main class="chat-container">
            <header class="chat-header">
                <button class="mobile-header-btn mobile-menu-btn" onclick="toggleSidebar()" title="Menu" aria-label="Menu">
                    <img
                        class="mobile-header-icon-img"
                        src="Images/burger-bar.png"
                        alt=""
                        aria-hidden="true"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
                    >
                    <span class="mobile-header-icon-text" style="display: none;">&#9776;</span>
                    <span class="mobile-header-label"></span>
                </button>
                <div class="header-center">
                    <div class="header-logo">LEXINO AI</div>
                    <div class="temp-mode-badge" id="tempModeBadge">Temp Mode</div>
                </div>
                <div class="header-actions">
                    <div class="mobile-more-wrap">
                        <button class="mobile-header-btn mobile-more-btn" id="mobileMoreBtn" onclick="toggleMobileHeaderMenu(event)" title="More" aria-label="More options" aria-expanded="false">
                            <span aria-hidden="true">...</span>
                        </button>
                        <div class="mobile-header-menu" id="mobileHeaderMenu" onclick="event.stopPropagation()" role="menu" aria-label="More options">
                            <button class="mobile-header-menu-item" onclick="deleteCurrentChatFromHeader()">
                                <span class="icon">&#10005;</span>
                                <span>Delete Chat</span>
                            </button>
                            <button class="mobile-header-menu-item" onclick="shareCurrentChatFromHeader()">
                                <span class="icon">&#8593;</span>
                                <span>Share Chat</span>
                            </button>
                            <button class="mobile-header-menu-item" onclick="togglePinCurrentChatFromHeader()">
                                <span class="icon">&#9733;</span>
                                <span id="mobilePinLabel">Pin Chat</span>
                            </button>
                        </div>
                    </div>
                    <button class="temp-chat-btn" id="tempChatBtn" onclick="startTempChat()" title="Chat" aria-label="Chat">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </button>
                    <button class="mobile-header-btn mobile-new-chat-btn" onclick="startNewChat()" title="New Chat" aria-label="New Chat">
                        <img
                            class="mobile-header-icon-img"
                            src="Images/new-chat.png"
                            alt=""
                            aria-hidden="true"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';"
                        >
                        <span class="mobile-header-icon-text" style="display: none;">&#9998;</span>
                        <span class="mobile-header-label">New Chat</span>
                    </button>
                    <div class="header-account" onclick="toggleAccountMenu()">
                        <div class="header-avatar">R</div>
                        <span class="header-account-name" id="headerProfileName">Ritik</span>
                    </div>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-state" id="emptyState">
                    <h2>LEXINO AI</h2>
                    <p>How can I help you today?</p>
                    <div class="suggestion-chips">
                        <div class="chip" onclick="useSuggestion('Explain quantum computing')">
                            Explain quantum computing
                        </div>
                        <div class="chip" onclick="useSuggestion('Write a business proposal')">
                            Write a business proposal
                        </div>
                        <div class="chip" onclick="useSuggestion('Brainstorm startup ideas')">
                            Brainstorm startup ideas
                        </div>
                        <div class="chip" onclick="useSuggestion('Review this code')">
                            Review this code
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-container ai-composer" role="group" aria-label="AI chat composer">
                        <div class="composer-input-row">
                            <button class="composer-icon-btn composer-attach-btn" onclick="triggerFileUpload()" title="Upload docs or images" aria-label="Attach files">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 5v14M5 12h14"></path>
                                </svg>
                            </button>
                            <textarea 
                                class="message-input" 
                                id="messageInput" 
                                placeholder="Ask anything"
                                rows="1"
                                aria-label="Message"
                                onkeydown="handleKeyPress(event)"
                                oninput="autoResize(this); updateComposerState()"
                            ></textarea>
                            <div class="composer-actions">
                                <button class="composer-icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice input" aria-label="Start voice input">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <path d="M12 19v3"></path>
                                    </svg>
                                </button>
                                <button class="composer-send-btn" id="sendBtn" onclick="sendMessage()" title="Send message" aria-label="Send message" disabled>
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M12 19V5"></path>
                                        <path d="m5 12 7-7 7 7"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="composer-footer">
                            <div class="composer-footer-spacer" aria-hidden="true"></div>
                            <div class="model-selector">
                                <button class="model-selector-btn" id="modelSelectorBtn" onclick="toggleModelMenu(event)" aria-haspopup="listbox" aria-expanded="false" aria-label="Select model">
                                    <span id="modelSelectorLabel">Fast</span>
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="m7 10 5 5 5-5"></path>
                                    </svg>
                                </button>
                                <div class="model-menu" id="modelMenu" role="listbox" aria-label="Model options">
                                    <button class="model-option active" type="button" role="option" aria-selected="true" onclick="selectComposerModel('Fast', 'llama-3.1-8b-instant')">
                                        <span>Fast</span>
                                        <small>Instant replies</small>
                                    </button>
                                    <button class="model-option" type="button" role="option" aria-selected="false" onclick="selectComposerModel('Pro', 'llama-3.3-70b-versatile')">
                                        <span>Pro</span>
                                        <small>Deeper reasoning</small>
                                    </button>
                                </div>
                            </div>
                            <div class="composer-footer-spacer" aria-hidden="true"></div>
                        </div>
                    </div>
                    <div class="uploaded-files" id="uploadedFiles"></div>
                    <input type="file" id="fileInput" class="file-input" onchange="handleFileUpload(event)" multiple accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.gif">
                </div>
            </div>
        </main>
    </div>

    <div class="chat-context-menu" id="chatContextMenu">
        <button class="chat-context-action" id="pinChatContextAction" onclick="togglePinChatFromContextMenu()">Pin Chat</button>
        <button class="chat-context-action" onclick="shareChatFromContextMenu()">Share Chat</button>
        <button class="chat-context-action danger" onclick="deleteChatFromContextMenu()">Delete Chat</button>
    </div>

        <script defer src="/_vercel/insights/script.js"></script>
        <script src="api.js"></script>
        <script src="script.js"></script>
</body>
</html>
