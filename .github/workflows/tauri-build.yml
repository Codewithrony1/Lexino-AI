name: "Publish Lexino AI Desktop Releases"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--verbose --bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: |
          npm ci
          cd website
          npm ci

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          LEXINO_PRODUCTION_URL: ${{ secrets.LEXINO_PRODUCTION_URL || 'https://lexinoai.in' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lexino AI ${{ github.ref_name }}"
          releaseBody: "Production release of the Lexino AI desktop app."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: List Build Artifacts (Debug & Verification)
        if: always()
        run: |
          echo "=== target/release ==="
          Get-ChildItem -Path src-tauri/target/release -ErrorAction SilentlyContinue | Select-Object Name, Length
          echo "=== target/release/bundle ==="
          Get-ChildItem -Path src-tauri/target/release/bundle -ErrorAction SilentlyContinue | Select-Object Name
          echo "=== target/release/bundle/nsis ==="
          Get-ChildItem -Path src-tauri/target/release/bundle/nsis -ErrorAction SilentlyContinue | Select-Object Name, Length
          echo "=== target/release/bundle/msi ==="
          Get-ChildItem -Path src-tauri/target/release/bundle/msi -ErrorAction SilentlyContinue | Select-Object Name, Length
        shell: powershell

      - name: Upload Build Artifacts to Workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexino-desktop-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

