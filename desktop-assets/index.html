<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexino AI</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #10a37f;
            --accent-glow: rgba(16, 163, 127, 0.25);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 24px;
            max-width: 400px;
            animation: fadeIn 0.6s ease-out;
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: transparent;
            background: linear-gradient(110deg, #10a37f 0%, #34d399 28%, #ffffff 50%, #86efac 72%, #10a37f 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        .logo-x {
            font-weight: 900;
            transform: skewX(-10deg);
            display: inline-block;
            margin: 0 -0.04em;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .loader {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 24px;
        }

        .offline-message {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: slideUp 0.4s ease-out;
        }

        .offline-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .offline-text {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn-retry {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .btn-retry:hover {
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">LE<span class="logo-x">X</span>INO<sup>AI</sup></div>
        <div class="subtitle">Your AI Academic Strategist</div>
        
        <div id="loader" class="loader"></div>

        <div id="offlineNotice" class="offline-message">
            <div class="offline-icon">📡</div>
            <div class="offline-text">
                Cannot connect to Lexino AI servers.<br>
                Please check your internet connection and try again.
            </div>
            <button class="btn-retry" onclick="checkConnection()">Retry Connection</button>
        </div>
    </div>

    <script>
        function checkConnection() {
            document.getElementById('loader').style.display = 'inline-block';
            document.getElementById('offlineNotice').style.display = 'none';

            // Check if Tauri is present in window context
            if (window.__TAURI__) {
                window.__TAURI__.core.invoke('check_connection')
                    .then((isOnline) => {
                        if (!isOnline) {
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('offlineNotice').style.display = 'flex';
                        }
                    })
                    .catch((err) => {
                        console.error("Tauri invoke error:", err);
                        fallbackFetchCheck();
                    });
            } else {
                fallbackFetchCheck();
            }
        }

        function fallbackFetchCheck() {
            const defaultUrl = 'https://lexinoai.in';
            fetch(`${defaultUrl}/api/config`, { mode: 'no-cors', cache: 'no-store' })
                .then(() => {
                    window.location.href = `${defaultUrl}/chat`;
                })
                .catch(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('offlineNotice').style.display = 'flex';
                });
        }

        // Run initial connection check on load
        window.addEventListener('load', checkConnection);
    </script>
</body>
</html>
