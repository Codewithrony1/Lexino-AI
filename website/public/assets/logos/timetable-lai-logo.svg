<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="timetableGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Obsidian Container with Subtle Border -->
  <rect width="100" height="100" rx="22" fill="#0B0B0F" stroke="rgba(251, 191, 36, 0.22)" stroke-width="1.5" />
  
  <!-- Outer Chrono Arc (Left Time Track) -->
  <path
    d="M 50 20 A 30 30 0 1 0 50 80"
    stroke="url(#timetableGoldGrad)"
    stroke-width="5"
    stroke-linecap="round"
  />
  
  <!-- Clock Ticks -->
  <line x1="25" y1="50" x2="31" y2="50" stroke="url(#timetableGoldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="25" x2="50" y2="31" stroke="url(#timetableGoldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="50" y1="75" x2="50" y2="69" stroke="url(#timetableGoldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Neural Strategy Network (Right Quadrant) -->
  <path d="M 50 50 L 50 35" stroke="url(#timetableGoldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="50" cy="35" r="3.5" fill="#FFE082" />
  
  <path d="M 50 50 L 66 38" stroke="url(#timetableGoldGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="66" cy="38" r="4" fill="#FFA000" stroke="#FFE082" stroke-width="1.5" />

  <path d="M 50 50 L 74 50" stroke="url(#timetableGoldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="74" cy="50" r="5" fill="#0B0B0F" stroke="url(#timetableGoldGrad)" stroke-width="3.5" />

  <path d="M 50 50 L 68 68" stroke="url(#timetableGoldGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="68" cy="68" r="4.5" fill="#0B0B0F" stroke="url(#timetableGoldGrad)" stroke-width="3" />

  <!-- Focal AI Intelligence Core (Glowing Teal Node) -->
  <circle cx="50" cy="50" r="5.5" fill="#3DE0D6" filter="url(#aiGlow)" />
</svg>
